<!DOCTYPE html>

<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Isfahan Municipality Financial Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "Vazirmatn", "sans-serif"],
                        "sans": ["Vazirmatn", "sans-serif"], // Set Vazirmatn as default sans
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
        /* Glassmorphism utilities */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(17, 22, 33, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mesh-bg {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 50%);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Decoration -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-3xl opacity-60 mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-blue-300/20 rounded-full blur-3xl opacity-60 mix-blend-multiply"></div>
<!-- Geometric Grid Pattern -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#2463eb 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Main Content -->
<div class="relative z-10 flex flex-1 flex-col items-center justify-center p-4 sm:p-8">
<div class="w-full max-w-[440px] glass-card rounded-2xl shadow-2xl overflow-hidden animate-fade-in-up">
<!-- Header Image / Pattern -->
<div class="h-32 w-full bg-gradient-to-br from-primary/10 to-primary/5 flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%232463eb\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
<div class="relative bg-white dark:bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-100 dark:border-slate-700 mt-8">
<span class="material-symbols-outlined text-primary text-4xl" data-alt="Government building icon">account_balance</span>
</div>
</div>
<!-- Card Content -->
<div class="px-8 pb-8 pt-10">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2 tracking-tight">سامانه مالی شهرداری</h1>
<h2 class="text-slate-500 dark:text-slate-400 font-medium text-sm">منابع انسانی شهرداری مرکزی</h2>
</div>
<form action="#" class="space-y-5">
<!-- Username -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 mr-1 block" for="username">
                            نام کاربری
                        </label>
<div class="relative">
<input class="w-full h-12 pr-11 pl-4 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 font-sans" id="username" placeholder="نام کاربری خود را وارد کنید" type="text"/>
<div class="absolute top-0 right-0 h-full w-10 flex items-center justify-center text-slate-400 pointer-events-none">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 mr-1 block" for="password">
                            رمز عبور
                        </label>
<div class="relative group">
<input class="w-full h-12 pr-11 pl-11 rounded-lg bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 font-sans" id="password" placeholder="رمز عبور خود را وارد کنید" type="password"/>
<div class="absolute top-0 right-0 h-full w-10 flex items-center justify-center text-slate-400 pointer-events-none">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<button class="absolute top-0 left-0 h-full w-10 flex items-center justify-center text-slate-400 hover:text-primary transition-colors cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-xs text-primary hover:text-primary/80 font-medium transition-colors" href="#">رمز عبور را فراموش کرده‌اید؟</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-all duration-300 transform hover:-translate-y-0.5 flex items-center justify-center gap-2 mt-4">
<span>ورود به سامانه</span>
<span class="material-symbols-outlined text-sm rtl:rotate-180">login</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center">
<span class="px-3 bg-white/80 dark:bg-slate-900/80 text-xs text-slate-400 font-medium backdrop-blur-sm">دسترسی سریع</span>
</div>
</div>
<div class="flex items-center justify-center gap-6 mt-6">
<a class="flex flex-col items-center group" href="#">
<div class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-slate-500 group-hover:text-primary group-hover:bg-primary/10 transition-all duration-300 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-xl">dashboard</span>
</div>
<span class="text-[11px] font-medium text-slate-500 group-hover:text-primary mt-2 transition-colors">داشبورد عمومی</span>
</a>
<a class="flex flex-col items-center group" href="#">
<div class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-800 flex items-center justify-center text-slate-500 group-hover:text-primary group-hover:bg-primary/10 transition-all duration-300 border border-slate-200 dark:border-slate-700">
<span class="material-symbols-outlined text-xl">engineering</span>
</div>
<span class="text-[11px] font-medium text-slate-500 group-hover:text-primary mt-2 transition-colors">احراز هویت پیمانکار</span>
</a>
</div>
</div>
<!-- Bottom decorative bar -->
<div class="h-1.5 w-full bg-gradient-to-r from-blue-400 via-primary to-blue-600"></div>
</div>
<!-- Copyright -->
<p class="mt-8 text-xs text-slate-400 text-center font-medium">
            © ۱۴۰۳ شهرداری اصفهان - تمامی حقوق محفوظ است
        </p>
</div>
</body></html>
